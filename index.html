        const map = L.map('map').setView([22.6394, 120.3015], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        const stationMarker = L.marker([22.6394, 120.3015]).addTo(map);
        stationMarker.bindPopup("<div class='p-1'><b class='text-amber-900'>📍 高雄車站 (中心點)</b><br><span class='text-xs text-stone-500'>半徑 7 公里核心區域</span></div>");

        let markers = [];
        const cafeListContainer = document.getElementById('cafe-list');
        const cafeCountEl = document.getElementById('cafe-count');
        if (cafeCountEl) {
            cafeCountEl.textContent = cafes.length;
        }

        function renderCafes(filteredCafes) {
            if (!cafeListContainer) return;
            cafeListContainer.innerHTML = '';
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            if (filteredCafes.length === 0) {
                cafeListContainer.innerHTML = '<div class="text-center py-8 text-stone-400 text-sm">找不到符合條件的咖啡廳</div>';
                return;
            }

            filteredCafes.forEach((cafe) => {
                const marker = L.marker([cafe.緯度, cafe.經度]).addTo(map);
                
                const popupContent = `
                    <div class="p-2 space-y-1.5 max-w-xs">
                        <h3 class="font-bold text-base text-amber-900">${cafe.店名}</h3>
                        <span class="inline-block bg-amber-100 text-amber-800 text-xs px-2 py-0.5 rounded-md font-semibold">${cafe.種類}</span>
                        <p class="text-xs text-stone-600">📍 ${cafe.地址}</p>
                        <p class="text-xs text-stone-600">📞 ${cafe.電話}</p>
                        <p class="text-xs text-stone-600">🕒 ${cafe.營業時間}</p>
                        <p class="text-xs text-amber-800 font-medium pt-1 border-t border-stone-100">⭐ ${cafe.推薦品項與價格}</p>
                    </div>
                `;
                marker.bindPopup(popupContent);
                markers.push(marker);

                const card = document.createElement('div');
                card.className = "p-3.5 border border-stone-200 rounded-xl hover:border-amber-700 hover:shadow-md transition cursor-pointer bg-white group";
                card.innerHTML = `
                    <h4 class="font-bold text-amber-900 group-hover:text-amber-700 text-sm md:text-base">${cafe.店名}</h4>
                    <p class="text-xs text-stone-500 my-1">${cafe.種類}</p>
                    <p class="text-xs text-stone-600 truncate">📍 ${cafe.地址}</p>
                    <p class="text-xs text-amber-800 font-medium mt-1.5 bg-amber-50/50 p-1.5 rounded-lg border border-amber-100">⭐ ${cafe.推薦品項與價格}</p>
                `;
                card.addEventListener('click', () => {
                    map.setView([cafe.緯度, cafe.經度], 16, { animate: true });
                    marker.openPopup();
                });
                cafeListContainer.appendChild(card);
            });
        }

        renderCafes(cafes);

        const searchInput = document.getElementById('search-input');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                const filtered = cafes.filter(c => 
                    c.店名.toLowerCase().includes(keyword) || 
                    c.地址.toLowerCase().includes(keyword) || 
                    c.種類.toLowerCase().includes(keyword) ||
                    c.推薦品項與價格.toLowerCase().includes(keyword)
                );
                renderCafes(filtered);
            });
        }
    </script>
